openapi: 3.1.0
info:
  title: Task API
  version: 0.1.0
  description: Authenticated task lifecycle contract for the todo-list example.
servers:
  - url: https://api.example.invalid
security:
  - bearerAuth: []
paths:
  /tasks:
    get:
      operationId: listTasks
      responses:
        "200":
          description: Accessible tasks
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTask"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: getTask
      responses:
        "200":
          description: Accessible task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTask"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTask
      responses:
        "204":
          description: Task deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HTTPProblem:
      type: object
      description: HTTP error details as described in RFC 9457.
      properties:
        type:
          type: string
          format: uri-reference
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          format: uri-reference
          description: A URI reference that identifies the specific occurrence of the problem.

    Task:
      type: object
      required:
        - id
        - title
        - ownerId
        - status
      properties:
        id:
          type: string
        title:
          type: string
          minLength: 1
        description:
          type: string
        ownerId:
          type: string
        status:
          type: string
          enum:
            - Todo
            - InProgress
            - Completed
    CreateTask:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
    UpdateTask:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum:
            - Todo
            - InProgress
            - Completed
        ownerId:
          type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/HTTPProblem"
              - type: object
                properties:
                  status:
                    type: integer
                    enum: [400]
                  type:
                    type: string
                    enum: ["https://example.invalid/probs/invalid-request"]
            examples:
              - invalid_request:
                  type: "https://example.invalid/probs/invalid-request"
                  title: "Invalid request"
                  status: 400
                  detail: "The request body is invalid."
                  instance: "/tasks"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/HTTPProblem"
              - type: object
                properties:
                  status:
                    type: integer
                    enum: [401]
                  type:
                    type: string
                    enum:
                      ["https://example.invalid/probs/authentication-required"]
            examples:
              - auth_required:
                  type: "https://example.invalid/probs/authentication-required"
                  title: "Authentication required"
                  status: 401
                  detail: "You must be authenticated to access this resource."
                  instance: "/tasks"
    NotFound:
      description: Task unavailable
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/HTTPProblem"
              - type: object
                properties:
                  status:
                    type: integer
                    enum: [404]
                  type:
                    type: string
                    enum: ["https://example.invalid/probs/task-not-found"]
            examples:
              - task_not_found:
                  type: "https://example.invalid/probs/task-not-found"
                  title: "Task not found"
                  status: 404
                  detail: "The task with the specified ID does not exist."
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/HTTPProblem"
              - type: object
                properties:
                  status:
                    type: integer
                    enum: [500]
                  type:
                    type: string
                    enum:
                      ["https://example.invalid/probs/internal-server-error"]
            examples:
              - internal_server_error:
                  type: "https://example.invalid/probs/internal-server-error"
                  title: "Internal server error"
                  status: 500
                  detail: "An unexpected error occurred on the server."
